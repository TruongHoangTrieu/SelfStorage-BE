version: '3.8'

services:
  # 1. NestJS Backend API Gateway (Port 5000)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selfstorage_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_INTERNAL_KEY=change_me_internal_key
    depends_on:
      - ai-service

  # 2. Python FastAPI AI Assistant Service (Port 8000)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: selfstorage_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AI_PORT=8000
      - AI_INTERNAL_KEY=change_me_internal_key
      - NEST_BASE_URL=http://backend:5000/api
